e COO . You will work directly with our Chief Operating Officer to explore, validate and build a new product proposition from the ground up. Think of this as a founder’s associate role for an internal startup: you will turn an ambiguous opportunity into actionable hypotheses, run experiments and help build the business case for launch. At Taxfix, AI is part of how we work and build—not just something we talk about. You will use AI tools hands-on to move faster from idea to evidence and from evidence to action. Duration: Fixed-term, full-time internship for a minimum of 3 months and up to 6 months. What you will do Discover and validate: Research markets and competitors, speak with potential customers and design experiments to test customer needs, demand and key assumptions. Build the business case: Develop pricing and unit-economics models, assess commercial viability and map the operational requirements for launch and scale. Turn ideas into tangible experiments: Use AI-native and no-code tools to create early prototypes, landing pages or other practical tests. Learn from the results and iterate with the COO and relevant teams. Shape the go-to-market plan: Explore positioning, distribution, regulatory considerations and how to build on Taxfix’s brand and capabilities. Communicate for decisions: Combine research, data and insights into clear recommendations, concise memos and presentations for the COO, Leadership Team and Board. Work AI-first and responsibly: Use approved AI tools to support research, analysis, prototyping and everyday workflows. Check outputs and sources critically, protect sensitive information and involve the right colleagues when needed. Academic collaboration If you are completing a Bachelor’s or Master’s degree, we encourage you to explore combining the internship with your thesis. Your work could inform real strategic decisions, with access to C-level perspectives and relevant company insights, subject to confidentiality and data-protection requirements. Who you are Entrepreneurial and hands-on: You are excited by building something from zero to one, comfortable with ambiguity and ready to take ownership rather than wait for a playbook. AI-native builder mindset: You are familiar with generative AI tools and use them—or are keen to use them—to research, analyze, prototype and automate. You enjoy turning ideas into tangible outputs; you do not need to be a software engineer. Critical thinker: You know that AI can accelerate your work but does not replace judgment. You question assumptions, verify outputs and can explain your reasoning. Structured and analytical: You can break down a broad question into hypotheses and practical workstreams. You are comfortable using Excel for analysis and modelling and PowerPoint to communicate a clear story. Curious and commercially minded: You enjoy understanding customers and connecting their needs to pricing, economics and a viable business model. Strong communicator: You can share ideas clearly and confidently with colleagues and senior stakeholders in German and English. Eager to learn: You are pursuing or have recently pursued a Bachelor’s or Master’s degree, ideally in business or a related field, and are motivated to learn quickly in a fast-moving environment. What we offer C-level mentorship: Work closely with the COO and gain first-hand exposure to executive decision-making. Real ownership: Contribute to building a new proposition, not just supporting a predefined process. Accelerated learning: Gain experience across strategy, product, commercial, operations and venture building. A strong network: Collaborate with Taxfix leaders and connect with our network of founders and investors. An international environment: Join a dynamic team in Berlin with a flexible hybrid setup. If you are excited to combine structured thinking, AI tools and a founder’s mindset to help build what comes next at Taxfix, we would love to hear from you. Why Taxfix? A chance to do meaningful, people-centric work with an international team of passionate professionals. Plenty of opportunities to socialise as a team. In addition to internal meetups, our international team hosts regular get-togethers—virtually and in person when possible. Free tax declaration filing, of course, through the Taxfix app—and internal support for all personal tax-related questions. Have a four-legged friend in your life? We’re happy to have dogs join us in the office. Excited? So are we. Check out our Life at Taxfix page on LinkedIn to get a glimpse of our culture. At Taxfix, we believe that incredible things happen when you have a wealth of perspectives and experiences. We're proudly committed to equal employment and development opportunities no matter your gender, race, religion, age, sexual orientation, colour, disability, or place of origin. To help mitigate any potential unconscious biases, we ask that you refrain from including your picture, age, or marital status on your CV. Let your experiences speak for themselves. Not sure if you meet all the requirements for this role? Please apply anyway. You might bring something special to the team that we hadn't considered previously. Find more English Speaking Jobs in Germany on Arbeitnow Intern", "apply_url": "https://www.arbeitnow.com/jobs/companies/taxfix/venture-develoment-intern-berlin-259844", "source": "Arbeitnow", "posted_at": "2026-11-18", "remote": false, "category": "Other student job", "flags": [], "first_seen": "2026-11-18", "last_seen": "2026-11-20", "id": "f324a6acbe4e"}, {"title": "Working Student - Business Analyst, Growth & Operations (m/f/d) – Dutch Market", "company": "raisin", "location": "Berlin, Berlin", "description": "Raisin is the world’s leading platform for savings and investment products. Founded in 2012, the FinTech connects consumers with banks in the EU, the UK and the US. This gives consumers better interest rates and banks a diversified form of refinancing . Our vision is to offer savings and i ongest into companies. Our whole idea fits in one line: build what should exist . We're looking for a Web Designer Intern to own how our websites look, feel and work. Ours, and our clients'. What you'll work on A wide range of work, across several brands at once: Our own sites. The Cloud Studios and GetMOW websites are live, and they're never finished. You'll redesign pages, sharpen what's there and add what's missing. Launches. We have new products in the pipeline. When one is ready to meet the world, you'll design the site it meets the world on, often starting from a blank page. Client websites. We also design and build websites for clients. You'll take projects from first idea to live site, and help present them. The details nobody asked for. Motion, interactions, the 404 page, what happens when you hover. That's where a website stops looking like everyone else's. By the end of your internship, you'll have several live websites with your name on them. Ownership, for real You won't be pushing pixels on someone else's mockup. You'll get a brief, sometimes just a problem, and the freedom to answer it your way. You'll work directly with Eli, our founder, from the first idea to launch day, and see your work go live in weeks, not quarters. That freedom comes with responsibility. If you think a page is wrong, say so and redesign it. Nobody here will ask you to stay in your lane. About AI Anyone can generate a website now. That's the problem. The internet is filling up with sites that look like they all came from the same prompt, and we're not hiring someone to make more of them. We use AI every day, and we'd love it if you do too: to explore faster, prototype faster and build things you couldn't build alone. But the idea has to be yours. Your taste, your references, your weirdness. We want work that nobody could copy by typing the same prompt. If something in your portfolio has made someone ask \"how did you do that?\", we want to see it. Who you are You've designed websites before, and you can show us. Client work, a side project, your own portfolio, a site for your friend's band: live sites count for more than concepts. You have opinions about type, layout and motion. You notice when something is a few pixels off, and it bothers you. You'd rather make something strange that works than something safe that nobody remembers. You'll need: Experience designing websites, and a portfolio that proves it. Strong skills in Figma or a similar design tool. A real eye for typography, layout and motion. Good English, written and spoken. To work independently. You'll manage your own time and projects, whether you're at home or in the office. Bonus points: You can turn a design into a simple live page with a no-code tool like Framer or Webflow, or with a little HTML and CSS. Nice to have, not a must: you won't be writing production code here. You've designed or built with AI before, and you have an opinion on where it helps and where it doesn't. There's something in your portfolio you made purely because you wanted it to exist. German. A design role, not a development role To be clear about what this is: this internship is about visual and interaction design . You'll spend your time on concepts, layouts, typography, motion and design systems, mostly in Figma. Development is handled separately. If you're mainly a frontend developer who designs a bit on the side, this probably isn't the right fit. If you're a designer who can't stop thinking about how a site looks, feels and moves, it is. What you get Ownership early. Real websites, real clients and real launches, from your first week. Creative freedom. We give you problems, not pixel specs. A portfolio that's actually live. Websites real people use, not concepts in a Figma file. Founder-level access. You work directly with Eli, and you see how a studio launches products. Work from anywhere in Germany. Remote is fine. If you're in Berlin, or want to be, there's a desk for you at our office. A way ering (m/f/d)", "company": "Statista", "location": "Hamburg or Berlin", "description": "At Statista , we’re all about facts and data, for we are the world's leading business data platform. By providing reliable and easy-to-use data as well as various data analytics products and services, we empower people worldwide to make fact-based decisions. Founded in Hamburg in 2007, we have quickly grown into a global company with offices in major cities such as London, New York, Berlin and Tokyo. And we still have a lot of plans. Our constant growth does not only prove our success, but also keeps creating new development and career opportunities for our employees. We value and celebrate our diverse culture. You are welcome here for who you are, no matter where you come from, what you look like, or whether you prefer bar graphs to pie charts. Your story matters – keep writing it as part of our team. Are you ready to join us? ABOUT THE TEAM Revenue Engineering sits within Data & Insights Operations and exists to close the gap between our Data Production & Insights teams and our Revenue teams. We do this in two ways: by bringing product expertise directly into client conversations (for example through strategic pitch support), and by bringing our data and insights teams closer to the customer through programs like Voice of Customer (VoC), where we analyze signals such as customer feedback forms and support tickets submitted by our CSMs. Alongside both, we run a tool that automates our competitor research and content, and the team keeps that tool sharp and its outputs trustworthy. As a Working Student on this team, you'll get a front-row seat to how a data company turns customer signal and market knowledge into commercial impact, working across all three areas rather than being boxed into just one. YOUR JOB As Working Student in Revenue Engineering, you help turn customer signals and market knowledge into commercial impact and keep our Data & Insights teams closely connected to o const cats=["All","Data","Side job","Other student job"];let cat="All";
const esc=s=>(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){
  const q=document.getElementById("q").value.toLowerCase();
  const rows=JOBS.filter(j=>(cat==="All"||j.category===cat)&&(!q||(j.title+" "+j.company+" "+j.description).toLowerCase().includes(q)));
  document.getElementById("list").innerHTML=rows.length?rows.map(j=>`
  <div class="card">
    <div class="t">${esc(j.title)}</div>
    <div class="meta">${esc(j.company)} · ${esc(j.location)} · via ${esc(j.source)}${j.posted_at?" · posted "+j.posted_at:""}</div>
    <div style="margin-top:6px"><span class="tag">${esc(j.category)}</span>${j.first_seen===TODAY?'<span class="tag new">New</span>':""}</div>
    ${j.flags.map(f=>`<div class="flag">⚠ ${esc(f)}</div>`).join("")}
    ${j.description?`<details><summary>Description</summary><div class="desc">${esc(j.description)}</div></details>`:""}
    <div class="act">
      <a class="btn primary" href="${esc(j.apply_url)}" target="_blank" rel="noopener noreferrer">Apply</a>
      <button class="btn ghost" onclick="copyCmd('${j.id}',this)">Tailor CV</button>
    </div>
  </div>`).join(""):'<p class="empty">No jobs match.</p>';
}
function copyCmd(id,b){
  const cmd="python -m workie.tailor "+id;
  navigator.clipboard?.writeText(cmd).then(()=>{b.textContent="Copied: "+cmd;setTimeout(()=>b.textContent="Tailor CV",2500)},()=>prompt("Run this in your repo:",cmd));
}
document.getElementById("cats").innerHTML=cats.map(c=>`<button class="chip${c===cat?" on":""}" data-c="${c}">${c} (${c==="All"?JOBS.length:JOBS.filter(j=>j.category===c).length})</button>`).join("");
