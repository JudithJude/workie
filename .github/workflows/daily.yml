name: Daily job refresh

on:
  schedule:
    - cron: "17 5 * * *"   # every day ~06:17 Berlin (winter time)
  workflow_dispatch: {}     # "Run workflow" button for manual runs

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python -m workie.run

      - name: Commit updated data
        run: |
          git config user.name "workie-bot"
          git config user.email "workie-bot@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "Job refresh $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
